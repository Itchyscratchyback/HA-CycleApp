          - entity: sensor.peak_fertility_end
            name: Peak Fertility End
          - entity: sensor.predicted_ovulation_date
            name: Most Likely Ovulation
          - entity: sensor.earliest_ovulation_date
            name: Earliest Ovulation
          - entity: sensor.latest_ovulation_date
            name: Latest Ovulation
          - type: section
            label: Fertility Metrics
          - entity: sensor.fertility_score
            name: Fertility Score
          - entity: sensor.fertility_status
            name: Fertility Status
          - entity: sensor.days_to_ovulation
            name: Days To Ovulation
          - entity: sensor.cycle_prediction_confidence
            name: Prediction Confidence
          - entity: sensor.cycle_length_stddev_robust
            name: Cycle Variation
          - entity: sensor.cycle_data_quality
            name: Data Quality
      - type: entities
        title: Raw Data
        show_header_toggle: false
        entities:
          - entity: input_text.period_start_history
          - entity: input_text.intercourse_history
          - entity: sensor.cycle_lengths_calculated
      - type: markdown

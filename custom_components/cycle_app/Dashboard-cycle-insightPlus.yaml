title: Menstrual Tracker v11
views:
  - title: Cycle Intelligence
    path: cycle
    icon: mdi:calendar-heart
    cards:
      - type: custom:button-card
        entity: sensor.cycle_day
        show_name: false
        show_icon: false
        show_state: false
        custom_fields:
          ring: |
            [[[
              const day =
                Number(states['sensor.cycle_day']?.state || 1);

              const length =
                Number(states['sensor.cycle_length_preferred']?.state || 28);

              const pct =
                Math.max(0, Math.min(100, (day/length)*100));

              const phase =
                states['sensor.cycle_phase']?.state || 'Unknown';

              const fertility =
                states['sensor.fertility_status']?.state || 'Unknown';

              const circumference = 565;
              const progress = circumference * (pct/100);

              let color = "#ff6fa5";

              switch (phase) {

                case "Period":
                  color = "#ff6fa5";
                  break;

                case "Follicular":
                  color = "#63a4ff";
                  break;

                case "Fertile":
                  color = "#ffd54f";
                  break;

                case "Ovulation":
                  color = "#ff4444";
                  break;

                case "Luteal":
                  color = "#6ecb63";
                  break;
              }

              return `
              <div style="display:flex;justify-content:center;">
                <svg width="260" height="260" viewBox="0 0 260 260">

                  <circle
                    cx="130"
                    cy="130"
                    r="90"
                    stroke="#303030"
                    stroke-width="16"
                    fill="none"/>

                  <circle
                    cx="130"
                    cy="130"
                    r="90"
                    stroke="${color}"
                    stroke-width="16"
                    fill="none"
                    stroke-linecap="round"
                    stroke-dasharray="${progress} ${circumference}"
                    transform="rotate(-90 130 130)"
                    style="transition: all 1s ease;"
                  />

                  <text
                    x="130"
                    y="105"
                    text-anchor="middle"
                    font-size="48"
                    fill="white">

                    ${day}
                  </text>

                  <text
                    x="130"
                    y="132"
                    text-anchor="middle"
                    font-size="18"
                    fill="#cccccc">

                    of ${length}
                  </text>

                  <text
                    x="130"
                    y="162"
                    text-anchor="middle"
                    font-size="18"
                    fill="${color}">

                    ${phase}
                  </text>

                  <text
                    x="130"
                    y="186"
                    text-anchor="middle"
                    font-size="14"
                    fill="#aaaaaa">

                    ${fertility} Fertility
                  </text>

                </svg>
              </div>
              `;
            ]]]
        styles:
          card:
            - height: 360px
            - border-radius: 30px
            - padding: 12px
      - type: entities
        title: Current Status
        entities:
          - entity: sensor.cycle_phase
            name: Current Phase
          - entity: sensor.cycle_day
            name: Current Cycle Day
          - entity: sensor.fertility_status
            name: Fertility Status
          - entity: sensor.fertility_score
            name: Fertility Score
          - entity: sensor.days_to_ovulation
            name: Days To Ovulation
          - entity: sensor.days_to_next_period
            name: Days To Period
          - entity: sensor.cycle_prediction_confidence
            name: Prediction Confidence
          - entity: sensor.cycle_data_quality
            name: Data Quality
      - type: entities
        title: Upcoming Events
        entities:
          - entity: sensor.predicted_ovulation_date
            name: Upcoming Ovulation
          - entity: sensor.predicted_next_period_date
            name: Upcoming Period
          - entity: sensor.predicted_next_ovulation_date
            name: Following Ovulation
          - entity: sensor.predicted_following_period_date
            name: Following Period
          - entity: sensor.pre_period_date
            name: Pre-Period Date
          - entity: sensor.days_to_next_ovulation_date
            name: Days To Following Ovulation
          - entity: sensor.days_to_pre_period
            name: Days To Pre-Period
      - type: markdown
        content: |

          ## Cycle Phase Legend

          🩷 **Period**

          🟦 **Follicular**

          🟨 **Fertile Window**

          🟥 **Ovulation**

          🟩 **Luteal**
      - type: entities
        title: Prediction Window
        entities:
          - entity: sensor.earliest_expected_period
            name: Earliest Expected Period
          - entity: sensor.predicted_next_period_date
            name: Predicted Period
          - entity: sensor.latest_expected_period
            name: Latest Expected Period
      - type: entities
        title: Statistics
        entities:
          - entity: sensor.cycle_count
            name: Recorded Cycles
          - entity: sensor.period_dates_count
            name: Total Period Dates
          - entity: sensor.last_cycle_length_robust
            name: Last Cycle
          - entity: sensor.cycle_length_mean_robust
            name: Robust Mean
          - entity: sensor.cycle_length_median
            name: Median
          - entity: sensor.cycle_length_stddev_robust
            name: StdDev
          - entity: sensor.shortest_cycle_length
            name: Shortest Cycle
          - entity: sensor.longest_cycle_length
            name: Longest Cycle
          - entity: sensor.cycle_sample_size
            name: Sample Size
          - entity: sensor.cycle_outlier_count
            name: Outliers
      - type: gauge
        entity: sensor.cycle_length_stddev_robust
        name: Cycle Stability
        min: 0
        max: 10
        severity:
          green: 0
          yellow: 2
          red: 4
      - type: entities
        title: Intercourse Analytics
        entities:
          - entity: sensor.last_intercourse_date
            name: Last Activity
          - entity: sensor.days_since_intercourse
            name: Days Since Activity
          - entity: sensor.intercourse_count_current_cycle
            name: Current Cycle Activity
          - entity: sensor.intercourse_count_fertile_window
            name: Fertile Window Activity
      - type: custom:apexcharts-card
        graph_span: 30d
        header:
          show: true
          title: Activity Timeline
        apex_config:
          chart:
            type: bar
            height: 350
            width: 500
          plotOptions:
            bar:
              horizontal: false
              columnWidth: '60%'
          xaxis:
            type: datetime
          tooltip:
            x:
              format: 'dd MMM yyyy HH:mm'
          annotations:
            xaxis:
              - x: 1
                x2: 5
                fillColor: '#ff6fa5'
                opacity: 0.1
              - x: 6
                x2: 10
                fillColor: '#63a4ff'
                opacity: 0.1
              - x: 11
                x2: 14
                fillColor: '#ffd54f'
                opacity: 0.12
              - x: 15
                x2: 15
                fillColor: '#ff4444'
                opacity: 0.18
              - x: 16
                x2: 28
                fillColor: '#6ecb63'
                opacity: 0.1
        series:
          - entity: input_text.intercourse_history
            name: Activity Count
            color: '#ff6fa5'
            type: column
            data_generator: |
              const s = (entity.state||'').trim();
              if (!s || ['unknown','unavailable','none','-'].includes(s.toLowerCase())) return [];
              const parts = s.split(',').map(p => p.trim()).filter(Boolean);
              const out = [];
              for (const part of parts) {
                let ts = part;
                let val = 1;
                if (part.includes('|')) {
                  const split = part.split('|');
                  ts = split[0] || ts;
                  val = Number(split[1]);
                  if (isNaN(val)) val = 1;
                }
                // Try strict ISO parse first
                let ms = Date.parse(ts);
                // Fallback: replace space with T (common formatting)
                if (isNaN(ms)) ms = Date.parse(ts.replace(' ', 'T'));
                // If still invalid, try parsing as YYYY-MM-DD manually (avoid timezone shifts)
                if (isNaN(ms)) {
                  const m = ts.match(/^(\d{4})-(\d{2})-(\d{2})$/);
                  if (m) {
                    const y = Number(m[1]);
                    const mo = Number(m[2]) - 1;
                    const d = Number(m[3]);
                    ms = Date.UTC(y, mo, d, 0, 0, 0);
                  }
                }
                if (isNaN(ms)) continue;
                out.push({ x: ms, y: val });
              }
              out.sort((a,b) => a.x - b.x);
              return out;
      - type: markdown
        content: >

          ## History Summary


          **Current Phase:** {{ states('sensor.cycle_phase') }}


          **Cycle Day:** {{ states('sensor.cycle_day') }}


          **Preferred Cycle Length:** {{ states('sensor.cycle_length_preferred')
          }} days


          **Confidence:** {{ states('sensor.cycle_prediction_confidence') }}


          **Data Quality:** {{ states('sensor.cycle_data_quality') }}


          **Median Length:** {{ states('sensor.cycle_length_median') }} days


          **Mean Length:** {{ states('sensor.cycle_length_mean_robust') }} days
      - type: horizontal-stack
        cards:
          - type: button
            entity: input_button.period_started
            name: Period Started
            icon: mdi:calendar-plus
          - type: custom:bubble-card
            card_type: button

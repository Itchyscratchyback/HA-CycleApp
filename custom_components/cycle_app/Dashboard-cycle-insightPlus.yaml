      - type: entities
        title: Pregnancy Chance Prediction
        show_header_toggle: false
        entities:
          - entity: sensor.fertility_window_status
            name: Current Status
          - type: section
            label: Fertility Window
          - entity: sensor.fertility_window_start
            name: Fertility Window Start
          - entity: sensor.fertility_window_end
            name: Fertility Window End
          - type: section
            label: Peak Fertility
          - entity: sensor.peak_fertility_start

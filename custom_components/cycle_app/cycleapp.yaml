# ##############################################################################
# MENSTRUAL PREDICTED v10.6
# Single Source of Truth:
# input_text.period_start_history
# ##############################################################################

input_button:
  period_started:
    name: Period Started
    icon: mdi:calendar-plus

  log_intercourse:
    name: Log Intercourse
    icon: mdi:heart

  clear_intercourse_history:
    name: Clear Intercourse History
    icon: mdi:delete

input_select:
  intercourse_type:
    name: Intercourse Type
    options:
      - Not selected
      - Together
      - F2M
      - M2F
    initial: Not selected

  intercourse_subtype1:
    name: Intercourse How
    options:
      - Not selected
      - Blowjob
      - Handjob
      - Creamfilljob
      - Oystercleaning
    initial: Not selected

  intercourse_subtype2:
    name: Intercourse Execution
    options:
      - Not selected
      - Full
      - Quick
    initial: Not selected

  intercourse_raw:
    name: Intercourse RAW
    options:
      - Not selected
      - Yes
      - No
      - Partially
    initial: Not selected

  intercourse_creampie:
    name: Intercourse Creampie
    options:
      - Not selected
      - Yes
      - No
    initial: Not selected



input_number:
  luteal_length:
    name: Luteal Length
    min: 10
    max: 17
    step: 1
    initial: 14

input_text:
  period_start_history:
    name: Period Start History
    mode: text
    max: 255

  cycle_data:
    name: Cycle Data
    max: 255
    initial: '{"periods":[],"intercourse":[]}'

  edit_period_start_1:
    name: Edit Period 1
  edit_period_start_2:
    name: Edit Period 2
  edit_period_start_3:
    name: Edit Period 3
  edit_period_start_4:
    name: Edit Period 4
  edit_period_start_5:
    name: Edit Period 5
  edit_period_start_6:
    name: Edit Period 6
  edit_period_start_7:
    name: Edit Period 7
  edit_period_start_8:
    name: Edit Period 8
  edit_period_start_9:
    name: Edit Period 9
  edit_period_start_10:
    name: Edit Period 10
  edit_period_start_11:
    name: Edit Period 11
  edit_period_start_12:
    name: Edit Period 12


  intercourse_history:
    name: Intercourse History
    mode: text
    max: 255

template:

  - sensor:

      # ########################################################################
      # HISTORY
      # ########################################################################

      - name: Period Dates Count
        unique_id: period_dates_count
        state: >
          {% set dates =
            states('input_text.period_start_history')
            .split(',')
            | map('trim')
            | select('match','^\d{4}-\d{2}-\d{2}$')
            | unique
            | list
          %}
          {{ dates|length }}

      - name: Cycle Count
        unique_id: cycle_count
        state: >
          {{ [states('sensor.period_dates_count')|int(0)-1,0]|max }}

      - name: Last Period Start
        unique_id: last_period_start
        device_class: date
        state: >
          {% set dates =
            states('input_text.period_start_history')
            .split(',')
            | map('trim')
            | select('match','^\d{4}-\d{2}-\d{2}$')
            | unique
            | list
            | sort
          %}
          {% if dates|length > 0 %}
            {{ dates[-1] }}
          {% else %}
            unknown
          {% endif %}


      - name: Previous Period Start
        unique_id: previous_period_start
        device_class: date
        state: >
          {% set dates =
            states('input_text.period_start_history')
            .split(',')
            | map('trim')
            | select('match','^\d{4}-\d{2}-\d{2}$')
            | unique
            | list
            | sort
          %}
          {% if dates|length > 1 %}
            {{ dates[-2] }}
          {% else %}
            unknown
          {% endif %}

      # ########################################################################
      # CYCLE LENGTHS
      # ########################################################################

      - name: Cycle Lengths Calculated
        unique_id: cycle_lengths_calculated
        state: >
          {% set dates =
            states('input_text.period_start_history')
            .split(',')
            | map('trim')
            | select('match','^\d{4}-\d{2}-\d{2}$')
            | unique
            | list
            | sort
          %}

          {% set ns = namespace(out=[]) %}

          {% for i in range(1, dates|length) %}

            {% set d0 = as_datetime(dates[i-1]) %}
            {% set d1 = as_datetime(dates[i]) %}

            {% set diff =
              ((as_timestamp(d1)-as_timestamp(d0))/86400)
              | round(0)
              | int
            %}

            {% if 15 <= diff <= 60 %}
              {% set ns.out = ns.out + [diff] %}
            {% endif %}

          {% endfor %}

          {{ ns.out[-24:] | join(',') }}

      - name: Last Cycle Length Robust
        unique_id: last_cycle_length_robust
        unit_of_measurement: d
        state: >
          {% set vals =
            states('sensor.cycle_lengths_calculated')
            .split(',')
            | select('ne','')
            | map('int')
            | list
          %}
          {{ vals[-1] if vals|length > 0 else 0 }}

      - name: Shortest Cycle Length
        unique_id: shortest_cycle_length
        unit_of_measurement: d
        state: >
          {% set vals =
            states('sensor.cycle_lengths_calculated')
            .split(',')
            | select('ne','')
            | map('int')
            | list
          %}
          {{ vals|min if vals|length > 0 else 0 }}

      - name: Longest Cycle Length
        unique_id: longest_cycle_length
        unit_of_measurement: d
        state: >
          {% set vals =
            states('sensor.cycle_lengths_calculated')
            .split(',')
            | select('ne','')
            | map('int')
            | list
          %}
          {{ vals|max if vals|length > 0 else 0 }}

      # ########################################################################
      # MEDIAN
      # ########################################################################

      - name: Cycle Length Median
        unique_id: cycle_length_median
        unit_of_measurement: d
        state: >
          {% set vals =
            states('sensor.cycle_lengths_calculated')
            .split(',')
            | select('ne','')
            | map('int')
            | list
            | sort
          %}

          {% set n = vals|length %}

          {% if n == 0 %}
            28
          {% elif n % 2 == 1 %}
            {{ vals[n//2] }}
          {% else %}
            {{ ((vals[n//2-1] + vals[n//2]) / 2) | round(1) }}
          {% endif %}

      # ########################################################################
      # SAMPLE SIZE
      # ########################################################################

      - name: Cycle Sample Size
        unique_id: cycle_sample_size
        state: >
          {% set vals =
            states('sensor.cycle_lengths_calculated')
            .split(',')
            | select('ne','')
            | list
          %}
          {{ vals|length }}

      # ########################################################################
      # OUTLIERS
      # ########################################################################

      - name: Cycle Outlier Count
        unique_id: cycle_outlier_count
        state: >
          {% set vals =
            states('sensor.cycle_lengths_calculated')
            .split(',')
            | select('ne','')
            | map('int')
            | list
            | sort
          %}

          {% set n = vals|length %}

          {% if n == 0 %}
            0
          {% else %}

            {% if n % 2 == 1 %}
              {% set median = vals[n//2] %}
            {% else %}
              {% set median = (vals[n//2-1] + vals[n//2]) / 2 %}
            {% endif %}

            {% set ns = namespace(count=0) %}

            {% for v in vals %}
              {% if (v - median)|abs > 10 %}
                {% set ns.count = ns.count + 1 %}
              {% endif %}
            {% endfor %}

            {{ ns.count }}

          {% endif %}

      # ########################################################################
      # ROBUST MEAN
      # ########################################################################

      - name: Cycle Length Mean Robust
        unique_id: cycle_length_mean_robust
        unit_of_measurement: d
        state: >
          {% set vals =
            states('sensor.cycle_lengths_calculated')
            .split(',')
            | select('ne','')
            | map('int')
            | list
            | sort
          %}

          {% set n = vals|length %}

          {% if n == 0 %}
            28
          {% else %}

            {% if n % 2 == 1 %}
              {% set median = vals[n//2] %}
            {% else %}
              {% set median = (vals[n//2-1] + vals[n//2]) / 2 %}
            {% endif %}

            {% set ns = namespace(filtered=[]) %}

            {% for v in vals %}
              {% if (v - median)|abs <= 10 %}
                {% set ns.filtered = ns.filtered + [v] %}
              {% endif %}
            {% endfor %}

            {% if ns.filtered|length > 0 %}
              {{ (ns.filtered|sum / ns.filtered|length) | round(1) }}
            {% else %}
              {{ median }}
            {% endif %}

          {% endif %}

      # ########################################################################
      # STDDEV
      # ########################################################################

      - name: Cycle Length StdDev Robust
        unique_id: cycle_length_stddev_robust
        unit_of_measurement: d
        state: >
          {% set vals =
            states('sensor.cycle_lengths_calculated')
            .split(',')
            | select('ne','')
            | map('int')
            | list
          %}

          {% if vals|length > 1 %}

            {% set mean = vals|sum / vals|length %}
            {% set ns = namespace(var=0) %}

            {% for v in vals %}
              {% set ns.var = ns.var + ((v - mean) ** 2) %}
            {% endfor %}

            {{ ((ns.var / vals|length) ** 0.5) | round(1) }}

          {% else %}
            0
          {% endif %}

      # ########################################################################
      # QUALITY
      # ########################################################################

      - name: Cycle Data Quality
        unique_id: cycle_data_quality
        state: >
          {% set sample =
            states('sensor.cycle_sample_size')|int(0)
          %}

          {% set outliers =
            states('sensor.cycle_outlier_count')|int(0)
          %}

          {% if sample >= 12 and outliers == 0 %}
            Excellent
          {% elif sample >= 8 and outliers <= 1 %}
            Good
          {% elif sample >= 4 %}
            Fair
          {% else %}
            Poor
          {% endif %}

      # ########################################################################
      # CONFIDENCE
      # ########################################################################

      - name: Cycle Prediction Confidence
        unique_id: cycle_prediction_confidence
        state: >
          {% set sample =
            states('sensor.cycle_sample_size')|int(0)
          %}

          {% set std =
            states('sensor.cycle_length_stddev_robust')|float(0)
          %}

          {% if sample >= 12 and std <= 2 %}
            High
          {% elif sample >= 6 and std <= 4 %}
            Medium
          {% else %}
            Low
          {% endif %}

      # ########################################################################
      # PREFERRED CYCLE LENGTH
      # ########################################################################

      - name: Cycle Length Preferred
        unique_id: cycle_length_preferred
        unit_of_measurement: d
        state: >
          {{ states('sensor.cycle_length_mean_robust')|int(28) }}

      # ########################################################################
      # CYCLE DAY
      # ########################################################################

      - name: Cycle Day
        unique_id: cycle_day
        unit_of_measurement: d
        state: >
          {% set start = states('sensor.last_period_start') %}

          {% if start not in ['unknown','unavailable',''] %}
            {{
              (
                (
                  as_timestamp(now().date())
                  -
                  as_timestamp(start)
                ) / 86400
              ) | int + 1
            }}
          {% else %}
            0
          {% endif %}

      # ########################################################################
      # PERIOD PREDICTION
      # ########################################################################

      - name: Predicted Next Period Date
        unique_id: predicted_next_period_date
        device_class: date
        state: >
          {% set start = states('sensor.last_period_start') %}
          {% set cycle =
            states('sensor.cycle_length_preferred')|int(28)
          %}

          {% if start not in ['unknown','unavailable',''] %}
            {{ as_datetime(start).date() + timedelta(days=cycle) }}
          {% else %}
            unknown
          {% endif %}

      - name: Days To Next Period
        unique_id: days_to_next_period
        unit_of_measurement: d
        state: >
          {% set nxt =
            states('sensor.predicted_next_period_date')
          %}

          {% if nxt not in ['unknown','unavailable',''] %}
            {{
              [
                (as_datetime(nxt).date() - now().date()).days,
                0
              ] | max
            }}
          {% else %}
            0
          {% endif %}

      # ########################################################################
      # PERIOD PREDICTION
      # ########################################################################

      - name: Predicted Ovulation Date
        unique_id: predicted_ovulation_date
        device_class: date
        state: >
          {% set period = states('sensor.predicted_next_period_date') %}
          {% set luteal = states('input_number.luteal_length') | int(14) %}

          {% if period not in ['unknown','unavailable','', none] %}
            {{ (strptime(period,'%Y-%m-%d').date() - timedelta(days=luteal)) }}
          {% else %}
            unknown
          {% endif %}


      # ########################################################################
      # DAYS TO OVULATION
      # #########################################################################

      - name: Days To Ovulation
        unique_id: days_to_ovulation
        unit_of_measurement: d

        state: >

          {% set ov =
             states('sensor.predicted_ovulation_date')
          %}

          {% if ov not in ['unknown','unavailable','',none] %}
            {{ (as_datetime(ov).date() - now().date()).days }}
          {% else %}
            unknown
          {% endif %}

      # ########################################################################
      # FERTILITY SCORE
      # ########################################################################

      - name: Fertility Score
        unique_id: fertility_score
        unit_of_measurement: "/10"

        state: >

          {% set d =
             states('sensor.days_to_ovulation')
             | int(99)
          %}

          {% if d == 0 %}
            10
          {% elif d == 1 %}
            9
          {% elif d == 2 %}
            9
          {% elif d == 3 %}
            9
          {% elif d == 4 %}
            8
          {% elif d == 5 %}
            8
          {% elif d == 6 %}
            7
          {% elif d == 7 %}
            7
          {% elif d == -1 %}
            10
          {% elif d == -2 %}
            9
          {% elif d == -3 %}
            8
          {% elif d == -4 %}
            6
          {% elif d == -5 %}
            4
          {% else %}
            2
          {% endif %}

      # ########################################################################
      # FERTILITY STATUS
      # ########################################################################

      - name: Fertility Status
        unique_id: fertility_status

        state: >

          {% set s =
            states('sensor.fertility_score')
            | int(0)
          %}

          {% if s >= 8 %}
            High
          {% elif s >= 5 %}
            Medium
          {% else %}
            Low
          {% endif %}

    # ##############################################################################
    # FUTURE PREDICTIONS
    # ##############################################################################

      # ##########################################################################
      # NEXT OVULATION (AFTER THE UPCOMING PERIOD)
      # ##########################################################################

      - name: Predicted Next Ovulation Date
        unique_id: predicted_next_ovulation_date
        device_class: date

        state: >

          {% set next_period =
             states('sensor.predicted_next_period_date')
          %}

          {% set cycle =
             states('sensor.cycle_length_preferred')
             | int(28)
          %}

          {% set luteal =
             states('input_number.luteal_length')
             | int(14)
          %}

          {% if next_period not in
             ['unknown','unavailable','',none] %}

            {% set future_period =
               as_datetime(next_period).date()
               + timedelta(days=cycle)
            %}

            {{ future_period - timedelta(days=luteal) }}

          {% else %}
            unknown
          {% endif %}

       # ##############################################################################
       # PERIOD WINDOW
       # ##############################################################################

      - name: Earliest Expected Period
        unique_id: earliest_expected_period
        device_class: date

        state: >

          {% set base =
             states('sensor.predicted_next_period_date')
          %}

          {% set std =
             states('sensor.cycle_length_stddev_robust')
             | float(2)
             | round(0)
             | int
          %}

          {% if base not in
             ['unknown','unavailable','',none] %}

            {{
              as_datetime(base).date()
              -
              timedelta(days=std)
            }}

          {% else %}
            unknown
          {% endif %}

      - name: Latest Expected Period
        unique_id: latest_expected_period
        device_class: date

        state: >

          {% set base =
             states('sensor.predicted_next_period_date')
          %}

          {% set std =
             states('sensor.cycle_length_stddev_robust')
             | float(2)
             | round(0)
             | int
          %}

          {% if base not in
             ['unknown','unavailable','',none] %}

            {{
              as_datetime(base).date()
              +
              timedelta(days=std)
            }}

          {% else %}
            unknown
          {% endif %}

      # ##########################################################################
      # PERIOD AFTER NEXT
      # ##########################################################################

      - name: Predicted Following Period Date
        unique_id: predicted_following_period_date
        device_class: date

        state: >

          {% set next_period =
             states('sensor.predicted_next_period_date')
          %}

          {% set cycle =
             states('sensor.cycle_length_preferred')
             | int(28)
          %}

          {% if next_period not in
             ['unknown','unavailable','',none] %}

            {{
              as_datetime(next_period).date()
              + timedelta(days=cycle)
            }}

          {% else %}
            unknown
          {% endif %}

      # ##########################################################################
      # DAYS TO NEXT OVULATION
      # ##########################################################################

      - name: Days To Next Ovulation Date
        unique_id: days_to_next_ovulation_date
        unit_of_measurement: d

        state: >

          {% set ov = states('sensor.predicted_next_ovulation_date') %}

          {% if ov not in ['unknown','unavailable','',none] %}

            {{
              (
                as_datetime(ov).date()
                -
                now().date()
              ).days
            }}

          {% else %}
            999
          {% endif %}



      # ##########################################################################
      # PRE-PERIOD DATE (NEXT PERIOD MINUS 5 DAYS) [Creampie time]
      # ##########################################################################

      - name: Pre Period Date
        unique_id: pre_period_date
        device_class: date

        state: >

          {% set period =
            states('sensor.predicted_next_period_date')
          %}

          {% if period not in
            ['unknown','unavailable','',none] %}

            {{
              as_datetime(period).date()
              - timedelta(days=5)
            }}

          {% else %}
            unknown
          {% endif %}

      # ##########################################################################
      # DAYS TO PRE-PERIOD [Creampie time]
      # ##########################################################################

      - name: Days To Pre Period
        unique_id: days_to_pre_period
        unit_of_measurement: d

        state: >

          {% set pre =
            states('sensor.pre_period_date')
          %}

          {% if pre not in
            ['unknown','unavailable','',none] %}

            {{
              (
                as_datetime(pre).date()
                -
                now().date()
              ).days
            }}

          {% else %}
            unknown
          {% endif %}

        

      - name: Intercourse Timeline Raw
        unique_id: intercourse_timeline_raw

        state: >
          {{ states('input_text.intercourse_history') }}



      - name: Cycle Phase Color
        unique_id: cycle_phase_color

        state: >

          {% set p =
              states('sensor.cycle_phase')
          %}

          {% if p == 'Period' %}
             #ff6fa5

          {% elif p == 'Follicular' %}
             #63a4ff

          {% elif p == 'Fertile' %}
             #ffd54f

          {% elif p == 'Ovulation' %}
             #ff4444

          {% else %}
             #6ecb63

          {% endif %}

      - name: Cycle Phase
        unique_id: cycle_phase
        state: >

          {% set day =
            states('sensor.cycle_day')|int(0)
          %}

          {% set ov =
            states('sensor.days_to_ovulation')|int(999)
          %}

          {% if day <= 5 %}
            Period

          {% elif ov > 5 %}
            Follicular

          {% elif ov > 0 %}
            Fertile

          {% elif ov == 0 %}
            Ovulation

          {% else %}
            Luteal

          {% endif %}

# ##############################################################################
# SENSORS: Ovulation | Pregnancy predictor
# ##############################################################################

      - name: Earliest Ovulation Date
        unique_id: earliest_ovulation_date
        device_class: date
        state: >

          {% set ov =
            states('sensor.predicted_ovulation_date')
          %}

          {% set std =
            states('sensor.cycle_length_stddev_robust')
            | int(1)
          %}

          {% if ov not in ['unknown','unavailable',''] %}
            {{
              as_datetime(ov).date()
              - timedelta(days=std)
            }}
          {% else %}
            unknown
          {% endif %}

      - name: Latest Ovulation Date
        unique_id: latest_ovulation_date
        device_class: date
        state: >

          {% set ov =
            states('sensor.predicted_ovulation_date')
          %}

          {% set std =
            states('sensor.cycle_length_stddev_robust')
            | int(1)
          %}

          {% if ov not in ['unknown','unavailable',''] %}
            {{
              as_datetime(ov).date()
              + timedelta(days=std)
            }}
          {% else %}
            unknown
          {% endif %}


      - name: Fertility Window Start
        unique_id: fertility_window_start
        device_class: date
        state: >

          {% set earliest =
            states('sensor.earliest_ovulation_date')
          %}

          {% if earliest not in ['unknown','unavailable',''] %}
            {{
              as_datetime(earliest).date()
              - timedelta(days=5)
            }}
          {% else %}
            unknown
          {% endif %}

      - name: Fertility Window End
        unique_id: fertility_window_end
        device_class: date
        state: >

          {% set latest =
            states('sensor.latest_ovulation_date')
          %}

          {% if latest not in ['unknown','unavailable',''] %}
            {{ as_datetime(latest).date() }}
          {% else %}
            unknown
          {% endif %}

      - name: Peak Fertility Start
        unique_id: peak_fertility_start
        device_class: date
        state: >

          {% set ov =
            states('sensor.predicted_ovulation_date')
          %}

          {% set confidence =
            states('sensor.cycle_prediction_confidence')
          %}

          {% if confidence == 'High' %}
            {% set width = 1 %}
          {% elif confidence == 'Medium' %}
            {% set width = 2 %}
          {% else %}
            {% set width = 3 %}
          {% endif %}

          {% if ov not in ['unknown','unavailable',''] %}
            {{
              as_datetime(ov).date()
              - timedelta(days=width)
            }}
          {% else %}
            unknown
          {% endif %}

      - name: Peak Fertility End
        unique_id: peak_fertility_end
        device_class: date
        state: >

          {% set ov =
            states('sensor.predicted_ovulation_date')
          %}

          {% set confidence =
            states('sensor.cycle_prediction_confidence')
          %}

          {% if confidence == 'High' %}
            {% set width = 1 %}
          {% elif confidence == 'Medium' %}
            {% set width = 2 %}
          {% else %}
            {% set width = 3 %}
          {% endif %}

          {% if ov not in ['unknown','unavailable',''] %}
            {{
              as_datetime(ov).date()
              + timedelta(days=width)
            }}
          {% else %}
            unknown
          {% endif %}

      - name: Fertility Window Status
        unique_id: fertility_window_status
        state: >

          {% set today = now().date() %}

          {% set fertile_start =
            as_datetime(
              states('sensor.fertility_window_start')
            ).date()
          %}

          {% set fertile_end =
            as_datetime(
              states('sensor.fertility_window_end')
            ).date()
          %}

          {% set peak_start =
            as_datetime(
              states('sensor.peak_fertility_start')
            ).date()
          %}

          {% set peak_end =
            as_datetime(
              states('sensor.peak_fertility_end')
            ).date()
          %}

          {% if peak_start <= today <= peak_end %}
            Peak Fertility

          {% elif fertile_start <= today <= fertile_end %}
            Fertile Window

          {% else %}
            Low Fertility

          {% endif %}






# ####################
# Automation
# ####################

automation:

# ##############################################################################
# AUTOMATION: CLEAR INTERCOURSE HISTORY
# ##############################################################################  

  - alias: Clear Intercourse History
    id: clear_intercourse_history

    trigger:
      - platform: state
        entity_id: input_button.clear_intercourse_history

    action:

      - service: input_text.set_value
        target:
          entity_id: input_text.intercourse_history
        data:
          value: ""
# ##############################################################################
# AUTOMATION: LOG INTERCOURSE
# ##############################################################################

  - alias: Log Intercourse v10.7
    id: log_intercourse_v107
    mode: queued

    trigger:
      - platform: state
        entity_id: input_button.log_intercourse

    action:

      - variables:

          stamp: >
            {{ now().strftime('%Y-%m-%dT%H:%M:%S') }}

          cycle_day: >
            {{ states('sensor.cycle_day') | int(0) }}

          entry: >
            {{ stamp }}|{{ cycle_day }}

          intercourse_type: >
            {{ states('input_select.intercourse_type') }}

          intercourse_subtype1: >
            {{ states('input_select.intercourse_subtype1') }}

          intercourse_subtype2: >
            {{ states('input_select.intercourse_subtype2') }}

          intercourse_raw: >
            {{ states('input_select.intercourse_raw') }}

          intercourse_creampie: >
            {{ states('input_select.intercourse_creampie') }}

          record: >
            {{ {
              'timestamp': stamp,
              'cycle_day': cycle_day,
              'intercourse_type': intercourse_type,
              'intercourse_subtype1': '' if intercourse_type == 'Together' else intercourse_subtype1,
              'intercourse_subtype2': intercourse_subtype2,
              'intercourse_raw': intercourse_raw,
              'intercourse_creampie': intercourse_creampie if intercourse_raw in ['Yes', 'Partially'] else ''
            } | to_json }}

      - condition: template
        value_template: >
          {{ intercourse_type != 'Not selected'
             and intercourse_subtype2 != 'Not selected'
             and intercourse_raw != 'Not selected'
             and (intercourse_type == 'Together' or intercourse_subtype1 != 'Not selected')
             and (intercourse_raw not in ['Yes', 'Partially'] or intercourse_creampie != 'Not selected') }}

      - service: input_text.set_value
        target:
          entity_id: input_text.intercourse_history
        data:
          value: "{{ entry }}"

      # Also append the new entry to the persisted history file (NDJSON)
      - service: cycle_app.save_history
        data:
          filename: "data/ha_cycle_app/intercourse_history.json"
          content: "{{ record }}"
          as_json: false
          append: true

      - service: input_select.select_option
        target:
          entity_id:
            - input_select.intercourse_type
            - input_select.intercourse_subtype1
            - input_select.intercourse_subtype2
            - input_select.intercourse_raw
            - input_select.intercourse_creampie
        data:
          option: Not selected

# ##############################################################################
# Save period_start_history to external file whenever it changes (append-only)
  - alias: Persist Period Start History to File
    id: persist_period_start_history
    trigger:
      - platform: state
        entity_id: input_text.period_start_history
    action:
      - service: cycle_app.save_history
        data:
          filename: "data/ha_cycle_app/period_start_history.json"
          content: "{{ trigger.to_state.state.split(',')[-1] | trim }}"
          as_json: true
          append: true

# Load persisted histories on Home Assistant start
  - alias: Load Persisted Histories at Startup
    id: load_persisted_histories
    trigger:
      - platform: homeassistant
        event: start
    action:
      - delay: '00:00:30'
      - service: cycle_app.load_history
        data:
          filename: "data/ha_cycle_app/intercourse_history.json"
          entity_id: input_text.intercourse_history
          limit: 1
      - service: cycle_app.load_history
        data:
          filename: "data/ha_cycle_app/period_start_history.json"
          entity_id: input_text.period_start_history
          limit: 21

# AUTOMATION: PERIOD STARTED 
# ##############################################################################

  - alias: Period Started v10.6
    id: period_started_v106
    mode: single

    trigger:
      - platform: state
        entity_id: input_button.period_started

    action:

      - variables:

          today: >
            {{ now().strftime('%Y-%m-%d') }}

          raw: >
            {{ states('input_text.period_start_history') }}

      - variables:

          dates: >

            {{
              (
                raw.split(',')
                | map('trim')
                | select('match','^\\d{4}-\\d{2}-\\d{2}$')
                | list
                + [today]
              )
              | unique
              | list
              | sort
            }}

      - service: input_text.set_value
        target:
          entity_id: input_text.period_start_history
        data:

          value: >
            {{ dates | join(',') }}

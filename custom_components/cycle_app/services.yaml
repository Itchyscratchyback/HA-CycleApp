add_period_start:
  name: Add period start
  description: Record a period start date (defaults to today).
  fields:
    date:
      name: Date
      description: Period start date.
      example: "2026-10-12"
      selector:
        date:

remove_period_start:
  name: Remove period start
  description: Remove a recorded period start date.
  fields:
    date:
      name: Date
      description: Period start date to remove.
      required: true
      example: "2026-10-12"
      selector:
        date:

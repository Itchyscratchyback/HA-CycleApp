title: Cycle insight
views:
  - title: Cycle Overview
    path: cycle_overview
    cards:
      - type: vertical-stack
        cards:
          - square: false
            type: grid
            cards:
              - type: custom:button-card
                entity: sensor.cycle_app_cycle_day
                show_icon: false
                show_state: false
                show_name: false
                variables:
                  background: ''
                  text_color: '#d9cfe6'
                  descriptions:
                    Period: >-
                      Bleeding phase. Cramps, lower back pain, tiredness and
                      lower energy are common, and hormone levels are at their
                      lowest.
                    Follicular: >-
                      Estrogen rises as the body prepares an egg. Many people
                      notice more energy, a better mood and clearer focus.
                    Fertile: >-
                      Fertile window. Estrogen peaks, and cervical fluid becomes
                      clear and stretchy. Energy and libido are often higher.
                    Ovulation: >-
                      An egg is released. Some people feel mild one-sided pelvic
                      pain, increased libido or slight spotting.
                    Luteal: >-
                      During this phase, some people notice breast tenderness,
                      bloating, fatigue, mood changes, or appetite changes.
                    Pre-period: >-
                      This is the Jurassic Shark week, hide all your cholate and
                      other crunches, dont argue or look them in the eyes.
                styles:
                  card:
                    - background: '[[[ return variables.background; ]]]'
                    - border-radius: 20px
                    - padding: 10px 12px
                    - box-shadow: 0 6px 24px rgba(0,0,0,0.35)
                    - min-height: 30px
                  grid:
                    - grid-template-areas: '"info ring"'
                    - grid-template-columns: 1fr 300px
                    - align-items: center
                    - column-gap: 12px
                  custom_fields:
                    info:
                      - justify-self: start
                      - align-self: center
                      - text-align: left
                      - padding-left: 6px
                    ring:
                      - width: 300px
                      - height: 300px
                      - display: block
                      - margin: 0 auto
                custom_fields:
                  info: |
                    [[[
                      const get = (e) => (states[e]?.state ?? 'unknown');
                      const num = (v, d) => { const n = parseFloat(v); return isNaN(n) ? d : n; };
                      const total = Math.max(15, Math.min(60, Math.round(num(get('sensor.cycle_app_cycle_length_preferred'), 28))));
                      const day = Math.max(1, Math.round(num(get('sensor.cycle_app_cycle_day'), 1)));
                      const sensorPhase = get('sensor.cycle_app_cycle_phase');
                      const prePeriod = day >= total - 4 && sensorPhase === 'Luteal';
                      const phase = prePeriod ? 'Pre-period' : sensorPhase;
                      const colors = { Period: '#ff5a7a', Follicular: '#63a4ff', Fertile: '#c44bd0',
                                       Ovulation: '#ff4d8d', Luteal: '#6ecb63', 'Pre-period': '#e0b030' };
                      const text = (variables.descriptions || {})[phase] || '';
                      const c = colors[phase] || '#9ca3af';
                      return `<div style="color:${variables.text_color};max-width:100%">
                        <div style="font-size:11px;letter-spacing:3px;opacity:.7">PHASE</div>
                        <div style="font-size:20px;font-weight:700;color:${c};margin:2px 0 8px">${phase}</div>
                        <div style="font-size:13px;line-height:1.45;white-space:normal">${text}</div>
                      </div>`;
                    ]]]
                  ring: |
                    [[[
                      return (function () {
                        const get = (e) => (states[e]?.state ?? 'unknown');
                        const num = (v, d) => { const n = parseFloat(v); return isNaN(n) ? d : n; };

                        const total  = Math.max(15, Math.min(60, Math.round(num(get('sensor.cycle_app_cycle_length_preferred'), 28))));
                        const luteal = Math.max(10, Math.min(17, Math.round(num(get('number.cycle_app_luteal_length'), 14))));
                        const rawDay = Math.max(1, Math.round(num(get('sensor.cycle_app_cycle_day'), 1)));
                        const day    = Math.min(total, rawDay);
                        const late   = Math.max(0, rawDay - total);

                        const phase     = get('sensor.cycle_app_cycle_phase');
                        const toPeriod  = num(get('sensor.cycle_app_days_to_next_period'), 0);
                        const score     = num(get('sensor.cycle_app_fertility_score'), 0);
                        const fertility = get('sensor.cycle_app_fertility_status');

                        const ovuD      = Math.max(1, Math.min(total, total - luteal));
                        const fertStart = Math.max(1, ovuD - 5);
                        const fertEnd   = Math.min(total, ovuD + 1);
                        const preStart  = Math.max(1, total - 4);
                        const menseEnd  = Math.min(5, total);

                        const colors = {
                          Period: '#ff5a7a', Follicular: '#63a4ff', Fertile: '#c44bd0',
                          Ovulation: '#ff4d8d', Luteal: '#6ecb63'
                        };
                        const phaseColor = colors[phase] || '#9ca3af';

                        const S = 300, cx = S / 2, cy = S / 2, r = 100, w = 16;
                        const rad = (deg) => (deg - 90) * Math.PI / 180;
                        const pt  = (a, rr) => [cx + rr * Math.cos(rad(a)), cy + rr * Math.sin(rad(a))];
                        const ang = (d) => ((d - 1) / total) * 360;
                        const arc = (d1, d2, rr) => {
                          const gap = 0.8;
                          let a1 = ang(d1) + gap, a2 = ang(d2 + 1) - gap;
                          if (a2 <= a1) a2 = a1 + 0.1;
                          const [x1, y1] = pt(a1, rr), [x2, y2] = pt(a2, rr);
                          return `M ${x1.toFixed(1)} ${y1.toFixed(1)} A ${rr} ${rr} 0 ${(a2 - a1) > 180 ? 1 : 0} 1 ${x2.toFixed(1)} ${y2.toFixed(1)}`;
                        };

                        // Segments, later ones draw on top of earlier ones
                        const seg = [
                          { a: 1, b: total, c: '#2d2438' },
                          { a: 1, b: menseEnd, c: 'url(#cr-period)' },
                          { a: menseEnd + 1, b: Math.max(menseEnd + 1, fertStart - 1), c: 'url(#cr-follicular)' },
                          { a: fertStart, b: fertEnd, c: 'url(#cr-fertile)' },
                          { a: fertEnd + 1, b: Math.max(fertEnd + 1, preStart - 1), c: 'url(#cr-luteal)' },
                          { a: preStart, b: total, c: 'url(#cr-pre)' }
                        ].filter(s => s.a <= s.b && s.a <= total)
                         .map(s => `<path d="${arc(s.a, s.b, r)}" fill="none" stroke="${s.c}" stroke-width="${w}" stroke-linecap="butt"/>`).join('');

                        // Day ticks and labels
                        let ticks = '';
                        for (let d = 1; d <= total; d++) {
                          const a = ang(d) + (360 / total) / 2;
                          const major = d === 1 || d % 7 === 0;
                          const [x1, y1] = pt(a, r + w / 2 + 3);
                          const [x2, y2] = pt(a, r + w / 2 + (major ? 9 : 6));
                          ticks += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${d === day ? '#fff' : '#6b5b7a'}" stroke-width="${major ? 1.6 : 1}"/>`;
                          if (major) {
                            const [tx, ty] = pt(a, r + w / 2 + 19);
                            ticks += `<text x="${tx.toFixed(1)}" y="${(ty + 3.5).toFixed(1)}" text-anchor="middle" font-size="10" fill="#a898b8">${d}</text>`;
                          }
                        }

                        // Progress arc (inner ring): elapsed part of the cycle
                        const ri = r - w / 2 - 10;
                        const aDay = ang(day) + (360 / total) / 2;
                        const [px0, py0] = pt(0, ri);
                        const [px1, py1] = pt(aDay, ri);
                        const progress = `
                          <circle cx="${cx}" cy="${cy}" r="${ri}" fill="none" stroke="#2d2438" stroke-width="4"/>
                          <path d="M ${px0.toFixed(1)} ${py0.toFixed(1)} A ${ri} ${ri} 0 ${aDay > 180 ? 1 : 0} 1 ${px1.toFixed(1)} ${py1.toFixed(1)}"
                                fill="none" stroke="${phaseColor}" stroke-width="4" stroke-linecap="round" opacity="0.9"/>`;

                        // Ovulation marker
                        const aOv = ang(ovuD) + (360 / total) / 2;
                        const [ox, oy] = pt(aOv, r);
                        const [ol1x, ol1y] = pt(aOv, r - w / 2 - 3);
                        const [ol2x, ol2y] = pt(aOv, r + w / 2 + 3);
                        const ovMark = `
                          <line x1="${ol1x.toFixed(1)}" y1="${ol1y.toFixed(1)}" x2="${ol2x.toFixed(1)}" y2="${ol2y.toFixed(1)}" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
                          <circle cx="${ox.toFixed(1)}" cy="${oy.toFixed(1)}" r="4" fill="#fff" opacity="0.95"/>`;

                        // Today marker with glow
                        const [mx, my] = pt(aDay, r);
                        const today = `
                          <circle cx="${mx.toFixed(1)}" cy="${my.toFixed(1)}" r="14" fill="${phaseColor}" opacity="0.25">
                            <animate attributeName="r" values="11;17;11" dur="2.4s" repeatCount="indefinite"/>
                            <animate attributeName="opacity" values="0.35;0.05;0.35" dur="2.4s" repeatCount="indefinite"/>
                          </circle>
                          <circle cx="${mx.toFixed(1)}" cy="${my.toFixed(1)}" r="8" fill="#3b82f6" stroke="#fff" stroke-width="3"/>`;

                        // Fertility score pips (0-10)
                        let pips = '';
                        for (let i = 0; i < 10; i++) {
                          const on = i < Math.round(score);
                          pips += `<rect x="${(cx - 45 + i * 9.5).toFixed(1)}" y="${cy + 52}" width="7" height="5" rx="2" fill="${on ? '#c44bd0' : '#3a2f46'}"/>`;
                        }

                        const sub = late > 0
                          ? `Period late by ${late} day${late === 1 ? '' : 's'}`
                          : (toPeriod === 0 ? 'Period expected today' : `Period in ${toPeriod} day${toPeriod === 1 ? '' : 's'}`);

                        return `
                        <svg viewBox="0 0 ${S} ${S}" width="${S}" height="${S}">
                          <defs>
                            <linearGradient id="cr-period" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff7a93"/><stop offset="1" stop-color="#e11d48"/></linearGradient>
                            <linearGradient id="cr-follicular" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8cc0ff"/><stop offset="1" stop-color="#4f8df0"/></linearGradient>
                            <linearGradient id="cr-fertile" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e879f9"/><stop offset="1" stop-color="#9333ea"/></linearGradient>
                            <linearGradient id="cr-luteal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#86efac"/><stop offset="1" stop-color="#4caf50"/></linearGradient>
                            <linearGradient id="cr-pre" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fde68a"/><stop offset="1" stop-color="#d4a017"/></linearGradient>
                            <filter id="cr-shadow" x="-30%" y="-30%" width="160%" height="160%">
                              <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.45"/>
                            </filter>
                          </defs>
                          <g filter="url(#cr-shadow)">${seg}</g>
                          ${ticks}
                          ${progress}
                          ${ovMark}
                          ${today}
                          <text x="${cx}" y="${cy - 26}" text-anchor="middle" font-size="11" letter-spacing="3" fill="#a898b8">DAY</text>
                          <text x="${cx}" y="${cy + 14}" text-anchor="middle" font-size="46" font-weight="700" fill="#fff">${rawDay}</text>
                          <text x="${cx}" y="${cy + 34}" text-anchor="middle" font-size="14" font-weight="600" fill="${phaseColor}">${phase}</text>
                          ${pips}
                          <text x="${cx}" y="${cy + 72}" text-anchor="middle" font-size="10" fill="#a898b8">${fertility} fertility</text>
                          <text x="${cx}" y="${S - 6}" text-anchor="middle" font-size="12" fill="#d9cfe6">${sub}</text>
                        </svg>`;
                      })();
                    ]]]
              - square: false
                type: grid
                cards:
                  - type: custom:mushroom-template-card
                    primary: Fertility Score
                    secondary: '{{ states(''sensor.cycle_app_fertility_score'') }}/10'
                    icon: mdi:flower
                    features_position: bottom
                    vertical: true
                  - type: shortcut
                    tap_action:
                      action: navigate
                      navigation_path: /pudding-rad
                    vertical: true
                    icon: mdi:ferris-wheel
                columns: 2
            columns: 1
          - type: grid
            columns: 3
            square: false
            cards:
              - type: custom:mushroom-template-card
                primary: Days To Ovulation
                icon: mdi:fruit-watermelon
                features_position: bottom
                vertical: true
                color: '#ff4966'
                tap_action:
                  action: more-info
                entity: sensor.predicted_ovulation_date
                secondary: |2-
                    {% set s = states('sensor.cycle_app_days_to_ovulation') %}
                    {% if s not in ['unknown','unavailable','', none] %}
                      {% set v = s | float(999) %}
                      {% if v > -5 %}
                        {{ v }} Day
                      {% else %}
                        {{ states('sensor.cycle_app_days_to_next_ovulation_date') }}
                      {% endif %}
                    {% else %}
                      {{ states('sensor.cycle_app_days_to_next_ovulation_date') }}
                    {% endif %}
              - type: custom:mushroom-template-card
                primary: Days to Creampie
                secondary: >
                  {% set v = states('sensor.cycle_app_days_to_pre_period') %} {%
                  if v in ['unknown','unavailable','', None] %}
                    —
                  {% else %}
                    {% set n = v | int(999) %}
                    {% if n <= 0 %} Now {% else %} {{ n }} {% endif %}
                  {% endif %}
                icon: mdi:liquid-spot
                features_position: bottom
                vertical: true
                color: '#FFFFFF'
                tap_action:
                  action: more-info
                entity: sensor.pre_period_date
              - type: custom:mushroom-template-card
                primary: Days To Period
                icon: mdi:calendar
                features_position: bottom
                color: '#ff4966'
                tap_action:
                  action: more-info
                vertical: true
                multiline_secondary: false
                hold_action:
                  action: none
                entity: sensor.predicted_next_period_date
                secondary: |
                  {{ states('sensor.cycle_app_days_to_next_period') if
                     states('sensor.cycle_app_days_to_next_period') not in
                     ['unknown','unavailable',''] else '—' }}
          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:mushroom-entity-card
                name: Cycle Mean
                entity: sensor.cycle_app_cycle_length_mean_robust
                icon: mdi:sync
              - type: custom:mushroom-entity-card
                name: Cycle Dev.
                entity: sensor.cycle_app_cycle_length_stddev_robust
                icon: mdi:sine-wave
          - square: false
            type: grid
            cards:
              - show_name: true
                show_icon: true
                type: button
                icon: mdi:calendar-start
                tap_action:
                  action: more-info
                hold_action:
                  action: perform-action
                  perform_action: button.press
                  confirmation:
                    text: Weet je het zeker?
                  target:
                    entity_id: button.period_started
                  data: {}
                name: Period Started
                entity: button.cycle_app_period_started
              - show_name: true
                show_icon: true
                type: button
                icon: mdi:candle
                tap_action:
                  action: perform-action
                  perform_action: automation.trigger
                  target:
                    entity_id: automation.special_0069
                  data:
                    skip_condition: true
                name: Set Mood
                color: pink
              - show_name: true
                show_icon: true
                type: button
                icon: mdi:dna
                hold_action:
                  action: perform-action
                  perform_action: script.log_button_press
                  target: {}
                tap_action:
                  action: more-info
                name: ' '
            columns: 3
          - type: custom:bubble-card
            card_type: button
            button_type: name
            name: Future Predictions
            icon: mdi:calendar-heart
            show_state: false
            tap_action:
              action: navigate
              navigation_path: '#future_predictions'
          - type: custom:bubble-card
            card_type: pop-up
            hash: '#future_predictions'
            name: Future Predictions
            icon: mdi:calendar-heart
            cards:
              - type: markdown
                content: >-
                  ## Future Ovulation Dates

                  {% set start =
                  states('sensor.cycle_app_predicted_ovulation_date') %}

                  {% set cycle =
                  states('sensor.cycle_length_mean_robust')|float(28) %}

                  {% set fmt = '%d-%m-%Y' %}


                  {% if start not in ['unknown','unavailable'] %}

                  {% set anchor = as_datetime(start) %}

                  • {{ anchor.strftime(fmt) }}

                  • {{ (anchor + timedelta(days=(cycle*1))).strftime(fmt) }}

                  • {{ (anchor + timedelta(days=(cycle*2))).strftime(fmt) }}

                  • {{ (anchor + timedelta(days=(cycle*3))).strftime(fmt) }}

                  • {{ (anchor + timedelta(days=(cycle*4))).strftime(fmt) }}

                  • {{ (anchor + timedelta(days=(cycle*5))).strftime(fmt) }}

                  • {{ (anchor + timedelta(days=(cycle*6))).strftime(fmt) }}

                  • {{ (anchor + timedelta(days=(cycle*7))).strftime(fmt) }}

                  • {{ (anchor + timedelta(days=(cycle*8))).strftime(fmt) }}

                  • {{ (anchor + timedelta(days=(cycle*9))).strftime(fmt) }}

                  • {{ (anchor + timedelta(days=(cycle*10))).strftime(fmt) }}

                  • {{ (anchor + timedelta(days=(cycle*11))).strftime(fmt) }}

                  • {{ (anchor + timedelta(days=(cycle*12))).strftime(fmt) }}

                  • {{ (anchor + timedelta(days=(cycle*13))).strftime(fmt) }}

                  {% endif %}


                  ---


                  ## Future Period Dates

                  {% set start =
                  states('sensor.cycle_app_predicted_next_period_date') %}


                  {% if start not in ['unknown','unavailable'] %}

                  {% set anchor = as_datetime(start) %}

                  • {{ anchor.strftime(fmt) }}

                  • {{ (anchor + timedelta(days=(cycle*1))).strftime(fmt) }}

                  • {{ (anchor + timedelta(days=(cycle*2))).strftime(fmt) }}

                  • {{ (anchor + timedelta(days=(cycle*3))).strftime(fmt) }}

                  • {{ (anchor + timedelta(days=(cycle*4))).strftime(fmt) }}

                  • {{ (anchor + timedelta(days=(cycle*5))).strftime(fmt) }}

                  • {{ (anchor + timedelta(days=(cycle*6))).strftime(fmt) }}

                  • {{ (anchor + timedelta(days=(cycle*7))).strftime(fmt) }}

                  • {{ (anchor + timedelta(days=(cycle*8))).strftime(fmt) }}

                  • {{ (anchor + timedelta(days=(cycle*9))).strftime(fmt) }}

                  • {{ (anchor + timedelta(days=(cycle*10))).strftime(fmt) }}

                  • {{ (anchor + timedelta(days=(cycle*11))).strftime(fmt) }}

                  • {{ (anchor + timedelta(days=(cycle*12))).strftime(fmt) }}

                  • {{ (anchor + timedelta(days=(cycle*13))).strftime(fmt) }}

                  {% endif %}
            button_type: name
            card_layout: large

# Requires apexcharts-card (HACS). Add via Edit > Add card > Manual.
# Replace sensor.intercourse_timeline with your entity ID if it differs.
# Bars: Together #ff6fa5 | F2M #63a4ff | M2F #ffd54f | Creampie (crown) #ffc107
# Click a legend item to hide/show it; the crown item filters creampie=Yes logs.
type: custom:apexcharts-card
graph_span: 31d
span:
  end: day
header:
  show: true
  title: Activity per day (31 days)
yaxis:
  - min: 0
    decimals: 0
    apex_config:
      forceNiceScale: true
      tickAmount: 4
apex_config:
  chart:
    type: bar
    stacked: true
    height: 350
  plotOptions:
    bar:
      columnWidth: '70%'
  grid:
    show: true
  xaxis:
    type: datetime
    labels:
      datetimeUTC: false
      format: 'dd MMM'
  legend:
    show: true
  dataLabels:
    formatter: |
      EVAL:function(val) { return val > 0 ? '👑' : ''; }
  tooltip:
    custom: |
      EVAL:function(o) {
        const s = o.w.config.series[o.seriesIndex];
        const pt = s.data[o.dataPointIndex];
        const d = new Date(pt[0]);
        const k = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
        const g = s.name.startsWith('👑') ? 'Crown' : s.name;
        const recs = (((window.__cycleDays || {})[k]) || {})[g] || [];
        if (!recs.length) return '<div style="display:none"></div>';
        const labels = {
          intercourse_type: 'Type', intercourse_subtype1: 'How',
          intercourse_subtype2: 'Execution', intercourse_raw: 'RAW',
          intercourse_creampie: 'Creampie', cycle_day: 'Cycle day'
        };
        let html = '<div style="padding:8px;font-size:12px"><b>' + k + ' - ' + s.name + ' (' + recs.length + ')</b>';
        recs.forEach(r => {
          html += '<hr style="margin:4px 0">';
          html += '<b>' + (r.timestamp || '').slice(11, 16) + '</b>';
          Object.keys(labels).forEach(f => {
            if (r[f] !== undefined && r[f] !== '' && r[f] !== 'Not selected') {
              html += '<br>' + labels[f] + ': ' + r[f] + (f === 'intercourse_creampie' && r[f] === 'Yes' ? ' 👑' : '');
            }
          });
        });
        return html + '</div>';
      }
series:
  - entity: sensor.intercourse_timeline
    name: Together
    color: '#ff6fa5'
    type: column
    show:
      datalabels: false
    data_generator: |
      const all = {}; const key = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
      (entity.attributes.records || []).forEach(r => {
        const k = (r.timestamp || '').slice(0, 10); if (!k || !r.intercourse_type) return;
        const g = r.intercourse_creampie === 'Yes' ? 'Crown' : r.intercourse_type;
        all[k] = all[k] || {}; (all[k][g] = all[k][g] || []).push(r);
      });
      window.__cycleDays = all;
      const t = new Date(); t.setHours(0,0,0,0); const out = [];
      for (let i = 30; i >= 0; i--) { const d = new Date(t); d.setDate(t.getDate() - i); out.push([d.getTime(), ((all[key(d)] || {})['Together'] || []).length]); }
      return out;

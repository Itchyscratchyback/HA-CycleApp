            name: Last Activity
          - entity: sensor.days_since_intercourse_3
            name: Days Since Activity
          - entity: sensor.intercourse_count_current_cycle_2
            name: Current Cycle Activity
          - entity: sensor.intercourse_count_fertile_window_3
            name: Fertile Window Activity
      - type: markdown
        content: >

          ## History Summary


          **Current Phase:** {{ states('sensor.cycle_app_cycle_phase') }}


          **Cycle Day:** {{ states('sensor.cycle_app_cycle_day') }}


          **Preferred Cycle Length:** {{
          states('sensor.cycle_app_cycle_length_preferred') }} days


          **Confidence:** {{
          states('sensor.cycle_app_cycle_prediction_confidence') }}


          **Data Quality:** {{ states('sensor.cycle_app_cycle_data_quality') }}


          **Median Length:** {{ states('sensor.cycle_app_cycle_length_median')
          }} days


          **Mean Length:** {{
          states('sensor.cycle_app_cycle_length_mean_robust') }} days
      - type: horizontal-stack
        cards:
          - show_name: true
            show_icon: true
            type: button
            entity: button.cycle_app_period_started
            name: Period Started
            icon: mdi:calendar-plus
          - type: custom:bubble-card
            card_type: button
            button_type: name
            name: Log Activity
            icon: mdi:heart
            tap_action:
              action: navigate
              navigation_path: '#log_activity'
            scrolling_effect: false
          - show_name: true
            show_icon: true
            type: button
            entity: button.cycle_app_clear_intercourse_history
            name: Clear Activity
            icon: mdi:delete
      - type: custom:bubble-card
        card_type: pop-up
        hash: '#log_activity'
        name: Log Activity
        icon: mdi:heart
        cards:
          - type: entities
            title: Log Activity
            show_header_toggle: false
            entities:
              - entity: select.cycle_app_intercourse_type
                name: Who did what
              - type: conditional
                conditions:
                  - entity: select.cycle_app_intercourse_type
                    state_not: Together
                  - entity: select.cycle_app_intercourse_type
                    state_not: Not selected
                row:
                  entity: select.cycle_app_intercourse_how
                  name: How
              - entity: select.cycle_app_intercourse_execution
                name: Execution
              - entity: select.cycle_app_intercourse_raw
                name: Did you go RAW
              - type: conditional
                conditions:
                  - entity: select.cycle_app_intercourse_raw
                    state: 'Yes'
                row:
                  entity: select.cycle_app_intercourse_creampie
                  name: Did you make a nice Creampie?
              - type: conditional
                conditions:
                  - entity: select.cycle_app_intercourse_raw
                    state: Partially
                row:
                  entity: select.cycle_app_intercourse_creampie
                  name: Did you make a nice Creampie?
          - type: button
            entity: button.cycle_app_log_intercourse
            name: Save Activity
            icon: mdi:content-save-heart
      - type: entities
        title: Diagnostics
        show_header_toggle: false
        entities:

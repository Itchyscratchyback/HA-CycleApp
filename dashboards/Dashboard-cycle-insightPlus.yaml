            name: Current Status
          - type: section
            label: Fertility Window
          - entity: sensor.cycle_app_fertility_window_start
            name: Fertility Window Start
          - entity: sensor.cycle_app_fertility_window_end
            name: Fertility Window End
          - type: section
            label: Peak Fertility
          - entity: sensor.cycle_app_peak_fertility_start
            name: Peak Fertility Start
          - entity: sensor.cycle_app_peak_fertility_end
            name: Peak Fertility End
          - entity: sensor.cycle_app_predicted_ovulation_date
            name: Most Likely Ovulation
          - entity: sensor.cycle_app_earliest_ovulation_date
            name: Earliest Ovulation
          - entity: sensor.cycle_app_latest_ovulation_date
            name: Latest Ovulation
          - type: section
            label: Fertility Metrics
          - entity: sensor.cycle_app_fertility_score
            name: Fertility Score
          - entity: sensor.cycle_app_fertility_status
            name: Fertility Status
          - entity: sensor.cycle_app_days_to_ovulation
            name: Days To Ovulation
          - entity: sensor.cycle_app_cycle_prediction_confidence
            name: Prediction Confidence
          - entity: sensor.cycle_app_cycle_length_stddev_robust
            name: Cycle Variation
          - entity: sensor.cycle_app_cycle_data_quality
            name: Data Quality
      - type: entities
        title: Raw Data
        show_header_toggle: false
        entities:
          - entity: text.cycle_app_period_start_history
          - entity: text.cycle_app_intercourse_history
          - entity: sensor.intercourse_history_count
          - entity: sensor.cycle_app_cycle_lengths_calculated
      - type: custom:bubble-card
        card_type: button
        button_type: name
        name: Future Predictions
        icon: mdi:calendar-heart
        show_state: false
        tap_action:
          action: navigate
          navigation_path: '#future_predictions'
      - type: custom:bubble-card
        card_type: pop-up
        hash: '#future_predictions'
        name: Future Predictions
        icon: mdi:calendar-heart
        cards:
          - type: markdown
            content: >

              ## Future Ovulation Dates

              {% set start = states('sensor.cycle_app_predicted_ovulation_date')
              %} {% set cycle =
              states('sensor.cycle_app_cycle_length_mean_robust')|float(28) %}

              {% if start not in ['unknown','unavailable'] %} {% set anchor =
              as_datetime(start) %}

              • {{ anchor.date() }}

              • {{ (anchor + timedelta(days=(cycle*1))).date() }}

              • {{ (anchor + timedelta(days=(cycle*2))).date() }}

              • {{ (anchor + timedelta(days=(cycle*3))).date() }}

              • {{ (anchor + timedelta(days=(cycle*4))).date() }}


title: Cycle insight+
views:
  - title: Cycle Intelligence
    path: cycle
    icon: mdi:calendar-heart
    cards:
      - type: custom:button-card
        entity: sensor.cycle_app_cycle_day
        show_name: false
        show_icon: false
        show_state: false
        custom_fields:
          ring: |
            [[[
              const day =
                Number(states['sensor.cycle_app_cycle_day']?.state || 1);

              const length =
                Number(states['sensor.cycle_app_cycle_length_preferred']?.state || 28);

              const pct =
                Math.max(0, Math.min(100, (day/length)*100));

              const phase =
                states['sensor.cycle_app_cycle_phase']?.state || 'Unknown';

              const fertility =
                states['sensor.cycle_app_fertility_status']?.state || 'Unknown';

              const circumference = 565;
              const progress = circumference * (pct/100);

              let color = "#ff6fa5";

              switch (phase) {

                case "Period":
                  color = "#ff6fa5";
                  break;

                case "Follicular":
                  color = "#63a4ff";
                  break;

                case "Fertile":
                  color = "#ffd54f";
                  break;

                case "Ovulation":
                  color = "#ff4444";
                  break;

                case "Luteal":
                  color = "#6ecb63";
                  break;
              }

              return `
              <div style="display:flex;justify-content:center;">
                <svg width="260" height="260" viewBox="0 0 260 260">

                  <circle
                    cx="130"
                    cy="130"
                    r="90"
                    stroke="#303030"
                    stroke-width="16"
                    fill="none"/>

                  <circle
                    cx="130"
                    cy="130"
                    r="90"
                    stroke="${color}"
                    stroke-width="16"
                    fill="none"
                    stroke-linecap="round"
                    stroke-dasharray="${progress} ${circumference}"
                    transform="rotate(-90 130 130)"
                    style="transition: all 1s ease;"
                  />

                  <text
                    x="130"
                    y="105"
                    text-anchor="middle"
                    font-size="48"
                    fill="white">

                    ${day}
                  </text>

                  <text
                    x="130"
                    y="132"
                    text-anchor="middle"
                    font-size="18"
                    fill="#cccccc">

                    of ${length}
                  </text>

                  <text
                    x="130"
                    y="162"
                    text-anchor="middle"
                    font-size="18"
                    fill="${color}">

                    ${phase}
                  </text>

                  <text
                    x="130"
                    y="186"
                    text-anchor="middle"
                    font-size="14"
                    fill="#aaaaaa">

                    ${fertility} Fertility
                  </text>

                </svg>
              </div>
              `;
            ]]]
        styles:
          card:
            - height: 360px
            - border-radius: 30px
            - padding: 12px
      - type: entities
        title: Current Status
        entities:
          - entity: sensor.cycle_app_cycle_phase
            name: Current Phase
          - entity: sensor.cycle_app_cycle_day
            name: Current Cycle Day
          - entity: sensor.cycle_app_fertility_status
            name: Fertility Status
          - entity: sensor.cycle_app_fertility_score
            name: Fertility Score
          - entity: sensor.cycle_app_days_to_ovulation
            name: Days To Ovulation
          - entity: sensor.cycle_app_days_to_next_period
            name: Days To Period
          - entity: sensor.cycle_app_cycle_prediction_confidence
            name: Prediction Confidence
          - entity: sensor.cycle_app_cycle_data_quality
            name: Data Quality
      - type: entities
        title: Upcoming Events
        entities:
          - entity: sensor.cycle_app_predicted_ovulation_date
            name: Upcoming Ovulation
          - entity: sensor.cycle_app_predicted_next_period_date
            name: Upcoming Period
          - entity: sensor.cycle_app_predicted_next_ovulation_date
            name: Following Ovulation
          - entity: sensor.cycle_app_predicted_following_period_date
            name: Following Period
          - entity: sensor.cycle_app_pre_period_date
            name: Pre-Period Date
          - entity: sensor.cycle_app_days_to_next_ovulation_date
            name: Days To Following Ovulation
          - entity: sensor.cycle_app_days_to_pre_period
            name: Days To Pre-Period
      - type: markdown
        content: |

          ## Cycle Phase Legend

          🩷 **Period**

          🟦 **Follicular**

          🟨 **Fertile Window**

          🟥 **Ovulation**

          🟩 **Luteal**
      - type: entities
        title: Prediction Window
        entities:
          - entity: sensor.cycle_app_earliest_expected_period
            name: Earliest Expected Period
          - entity: sensor.cycle_app_predicted_next_period_date
            name: Predicted Period
          - entity: sensor.cycle_app_latest_expected_period
            name: Latest Expected Period
      - type: entities
        title: Statistics
        entities:
          - entity: sensor.cycle_app_cycle_count
            name: Recorded Cycles
          - entity: sensor.cycle_app_period_dates_count
            name: Total Period Dates
          - entity: sensor.cycle_app_last_cycle_length_robust
            name: Last Cycle
          - entity: sensor.cycle_app_cycle_length_mean_robust
            name: Robust Mean
          - entity: sensor.cycle_app_cycle_length_median
            name: Median
          - entity: sensor.cycle_app_cycle_length_stddev_robust
            name: StdDev
          - entity: sensor.cycle_app_shortest_cycle_length
            name: Shortest Cycle
          - entity: sensor.cycle_app_longest_cycle_length
            name: Longest Cycle
          - entity: sensor.cycle_app_cycle_sample_size
            name: Sample Size
          - entity: sensor.cycle_app_cycle_outlier_count
            name: Outliers
      - type: gauge
        entity: sensor.cycle_app_cycle_length_stddev_robust
        name: Cycle Stability
        min: 0
        max: 10
        severity:
          green: 0
          yellow: 2
          red: 4
      - type: entities
        title: Intercourse Analytics
        entities:

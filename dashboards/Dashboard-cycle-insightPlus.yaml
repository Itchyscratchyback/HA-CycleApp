              (entity.attributes.records || []).forEach(r => {
                const k = (r.timestamp || '').slice(0, 10); if (!k || !r.intercourse_type) return;
                const g = r.intercourse_creampie === 'Yes' ? 'Crown' : r.intercourse_type;
                all[k] = all[k] || {}; (all[k][g] = all[k][g] || []).push(r);
              });

              window.__cycleDays = all;

              const t = new Date(); t.setHours(0,0,0,0); const out = [];

              for (let i = 30; i >= 0; i--) { const d = new Date(t);
              d.setDate(t.getDate() - i); out.push([d.getTime(), ((all[key(d)]
              || {})['M2F'] || []).length]); }

              return out;
          - entity: sensor.intercourse_timeline
            name: 👑 Creampie
            color: '#ffc107'
            type: column
            show:
              datalabels: true
            data_generator: >
              const all = {}; const key = d => d.getFullYear() + '-' +
              String(d.getMonth()+1).padStart(2,'0') + '-' +
              String(d.getDate()).padStart(2,'0');

              (entity.attributes.records || []).forEach(r => {
                const k = (r.timestamp || '').slice(0, 10); if (!k || !r.intercourse_type) return;
                const g = r.intercourse_creampie === 'Yes' ? 'Crown' : r.intercourse_type;
                all[k] = all[k] || {}; (all[k][g] = all[k][g] || []).push(r);
              });

              window.__cycleDays = all;

              const t = new Date(); t.setHours(0,0,0,0); const out = [];

              for (let i = 30; i >= 0; i--) { const d = new Date(t);
              d.setDate(t.getDate() - i); out.push([d.getTime(), ((all[key(d)]
              || {})['Crown'] || []).length]); }

              return out;

          - entity: sensor.cycle_app_fertility_status
          - entity: sensor.cycle_app_predicted_ovulation_date
          - entity: sensor.cycle_app_predicted_next_period_date
          - entity: sensor.cycle_app_days_to_ovulation
          - entity: sensor.cycle_app_days_to_next_period
          - entity: sensor.cycle_app_cycle_prediction_confidence
      - type: entities

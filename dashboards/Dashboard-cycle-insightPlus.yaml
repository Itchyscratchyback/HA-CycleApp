                all[k] = all[k] || {}; (all[k][g] = all[k][g] || []).push(r);
              });

              window.__cycleDays = all;

              const t = new Date(); t.setHours(0,0,0,0); const out = [];

              for (let i = 30; i >= 0; i--) { const d = new Date(t);
              d.setDate(t.getDate() - i); out.push([d.getTime(), ((all[key(d)]
              || {})['F2M'] || []).length]); }

              return out;
          - entity: sensor.intercourse_timeline
            name: M2F
            color: '#ffd54f'
            type: column
            show:
              datalabels: false
            data_generator: >
              const all = {}; const key = d => d.getFullYear() + '-' +
